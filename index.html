<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Student Task Manager</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <div class="container">


        <!-- =========================
             HEADER
        ========================== -->

        <div class="header">

            <div>

                <h1>
                    🎓 Student Tasks
                </h1>

                <p>
                    Organize your study life
                </p>

            </div>


            <div class="header-right">

                <button id="themeBtn">
                    🌙
                </button>

                <div
                    class="date"
                    id="currentDate"
                ></div>

            </div>

        </div>



        <!-- =========================
             PROGRESS
        ========================== -->

        <div class="progress-card">

            <div class="progress-info">

                <span>
                    Today's Progress
                </span>

                <strong id="progressPercentage">
                    0%
                </strong>

            </div>


            <div class="progress-bar">

                <div id="progressFill"></div>

            </div>

        </div>



        <!-- =========================
             SEARCH
        ========================== -->

        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="🔎 Search tasks..."
            >

        </div>



        <!-- =========================
             ADD TASK
        ========================== -->

        <div class="task-input">


            <input
                type="text"
                id="taskInput"
                placeholder="What do you need to do?"
            >


            <select id="priorityInput">

                <option value="low">
                    🟢 Low
                </option>

                <option
                    value="medium"
                    selected
                >
                    🟡 Medium
                </option>

                <option value="high">
                    🔴 High
                </option>

            </select>


            <input
                type="date"
                id="deadlineInput"
            >


            <button id="addTaskBtn">
                + Add Task
            </button>

        </div>



        <!-- =========================
             FILTERS
        ========================== -->

        <div class="filters">

            <button
                class="filter-btn active"
                data-filter="all"
            >
                All
            </button>


            <button
                class="filter-btn"
                data-filter="pending"
            >
                Pending
            </button>


            <button
                class="filter-btn"
                data-filter="completed"
            >
                Completed
            </button>

        </div>



        <!-- =========================
             TASK LIST
        ========================== -->

        <ul id="taskList"></ul>



        <!-- =========================
             TASK COUNTER
        ========================== -->

        <div class="task-counter">

            <span id="taskCount">
                0 tasks - 0 completed
            </span>

        </div>


    </div>



    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="script.js"></script>

</body>

</html>
